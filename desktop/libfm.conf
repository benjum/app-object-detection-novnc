# Installed to /etc/xdg/libfm/libfm.conf.
#
# That path is not a guess and not a preference. libfm loads its config with
# fm_config_load_from_file(cfg, NULL), which hardcodes the name
# "libfm/libfm.conf" and searches XDG_CONFIG_DIRS (/etc/xdg) and then
# XDG_CONFIG_HOME (~/.config). It does NOT read
# ~/.config/pcmanfm/<profile>/libfm.conf -- that directory holds pcmanfm's own
# pcmanfm.conf, and a libfm.conf placed beside it is simply ignored. Settings
# put there look right, load never, and fail silently.
#
# System-wide rather than seeded into the home directory, for the same reason
# as mimeapps.list: the defaults then hold with OSP_SEED_DESKTOP=0, under any
# $HOME, and -- the case that actually bit -- in a home directory carried over
# from an older image. A user who changes a setting through Preferences gets
# their own ~/.config/libfm/libfm.conf, which is read afterwards and wins.

# Thumbnails are the point of the file browser in this image: an image and its
# _detected.jpg sit next to each other in the icon view, and the difference is
# visible before you open either one.

[config]
single_click=0
use_trash=0
confirm_del=1

# Without this, double-clicking a launcher on the desktop pops "This file is an
# executable... Open / Execute / Cancel" instead of starting the application.
# libfm calls it quick_exec -- "don't ask user for action on executable launch"
# -- and it defaults to off. It is the only switch for this; the consequence is
# that an executable script double-clicked in a file window now runs rather
# than asking, which is what every other desktop does.
quick_exec=1
show_thumbnail=1
thumbnail_local=1
thumbnail_max=8192
terminal=xfce4-terminal
si_unit=0
drop_default_action=auto

[ui]
big_icon_size=64
small_icon_size=16
pane_icon_size=16
thumbnail_size=128
show_thumbnail=1
