[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-font-name=Sans 10
gtk-application-prefer-dark-theme=true

# Animations are cheap locally and expensive over VNC: every frame of a fade
# is a full framebuffer update pushed down the websocket. Off, the desktop
# feels sharper on a slow link rather than slower.
gtk-enable-animations=false

# There is no xsettings daemon in this image -- no XFCE session, no
# gnome-settings-daemon -- so GTK3 reads this file directly. That is the whole
# reason it is seeded into the home directory rather than set through dconf.
