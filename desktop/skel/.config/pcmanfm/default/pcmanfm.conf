# PCManFM does two jobs here: it draws the desktop (wallpaper, icons, the
# right-click menu) and it provides the file windows. `pcmanfm --desktop`
# starts the first; clicking anything starts the second.

[config]
bm_open_method=0

[volume]
mount_on_startup=0
mount_removable=0
autorun=0

[desktop]
wallpaper_mode=stretch
wallpaper_common=1
wallpaper=/app/desktop/wallpaper.png
desktop_bg=#121a26
desktop_fg=#e8eef6
desktop_shadow=#000000
desktop_font=Sans 10
show_wm_menu=0
show_documents=0
show_trash=0
show_mounts=0

[ui]
always_show_tabs=0
win_width=1180
win_height=760
splitter_pos=190
side_pane_mode=places
view_mode=icon
show_hidden=0
sort=name;ascending;
toolbar=newtab;navigation;home;
show_statusbar=1
pathbar_mode_buttons=0
